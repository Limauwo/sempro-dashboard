<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Smart Composter memantau kompos dan memberikan peringatan lebih awal."
    />
    <title>Masuk — Smart Composter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro__content">
          <p class="eyebrow">Smart Composter</p>
          <h1 id="intro-title">Pantau kompos, terima peringatan lebih awal.</h1>
          <p class="intro__description">
            Sistem telemetri IoT dan peringatan dini berbasis aturan untuk
            pengomposan limbah organik pasar tradisional.
          </p>
        </div>
      </section>

      <section class="login-area" aria-label="Formulir masuk">
        <form class="login-card" id="login-form">
          <h2>Masuk</h2>
          <p class="login-card__description">
            Gunakan akun yang diberikan oleh pengelola.
          </p>

          <div class="form-field">
            <label for="username">Nama pengguna</label>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="contoh: petani01"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Kata sandi</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Masukkan kata sandi"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit">Masuk</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
